

```yaml
name: Bug 反馈
description: 报告迁移失败、闪退或数据异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认已备份数据，并尽量提供复现步骤。
  - type: input
    id: app-version
    attributes:
      label: KCU-Migrator 版本
      placeholder: 例如 v0.1.0-alpha / commit hash
    validations:
      required: true
  - type: input
    id: launcher
    attributes:
      label: 启动器与版本
      placeholder: 例如 FCL 1.2.3
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 选择旧目录...
        2. 勾选...
        3. 点击迁移...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      render: shell
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认项
      options:
        - label: 我已备份数据
          required: true
        - label: 我已搜索过现有 Issue
          required: true